<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>

  <!-- Car body -->
  <g transform="translate(50, 70)">
    <!-- Main car shape -->
    <rect x="20" y="30" width="60" height="35" rx="8" fill="#F59E0B"/>

    <!-- Car top/cabin -->
    <rect x="30" y="15" width="40" height="20" rx="6" fill="#F59E0B"/>

    <!-- Front window -->
    <rect x="32" y="17" width="12" height="15" rx="2" fill="#DBEAFE" opacity="0.6"/>

    <!-- Back window -->
    <rect x="46" y="17" width="12" height="15" rx="2" fill="#DBEAFE" opacity="0.6"/>

    <!-- Front wheel -->
    <circle cx="28" cy="68" r="8" fill="#1F2937"/>
    <circle cx="28" cy="68" r="5" fill="#F59E0B"/>

    <!-- Back wheel -->
    <circle cx="72" cy="68" r="8" fill="#1F2937"/>
    <circle cx="72" cy="68" r="5" fill="#F59E0B"/>

    <!-- Lights -->
    <circle cx="20" cy="38" r="2" fill="#FBBF24"/>
    <circle cx="20" cy="45" r="2" fill="#DC2626"/>
  </g>

  <!-- Log/Book lines on the side -->
  <g transform="translate(115, 75)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="8" x2="25" y2="8" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="16" x2="20" y2="16" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1F2937">
    TaxiLog
  </text>
</svg>